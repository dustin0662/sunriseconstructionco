<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Midway — Reference Drawings</title>
<style>
  :root{--bg:#0a0a14;--panel:rgba(18,22,36,.94);--fg:#e8eaf0;--muted:#9aa1b2;--accent:#f97316;
    --ok:#22c55e;--warn:#facc15;--bad:#ef4444;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;padding:24px;gap:18px}
  header{width:100%;max-width:980px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header .t{font-size:18px;font-weight:600}
  header .s{color:var(--muted);font-size:12px}
  .btn{background:rgba(255,255,255,.06);color:var(--fg);border:1px solid rgba(255,255,255,.12);
    border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn.primary{background:rgba(249,115,22,.28);border-color:rgba(249,115,22,.55);color:#ffe7d4}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  a.btn{text-decoration:none;display:inline-block}
  .card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:18px;width:100%;max-width:980px}
  .card h2{margin:0 0 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  input[type=text],textarea{padding:9px 11px;background:rgba(255,255,255,.05);color:var(--fg);
    border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:14px;font-family:inherit;width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #drop{border:1.5px dashed rgba(255,255,255,.22);border-radius:10px;padding:24px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:border-color .15s}
  #drop:hover,#drop.over{border-color:var(--accent);color:var(--fg)}
  #drop input{display:none}
  #picked{font-size:13px;color:var(--fg);margin-top:8px;min-height:18px}
  #bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;display:none;margin-top:10px}
  #bar.show{display:block} #bar > div{height:100%;width:0;background:var(--accent);transition:width .15s}
  #status{font-size:12px;color:var(--muted);min-height:16px;margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
  th{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  td.name a{color:#ffd9b4;text-decoration:none;font-weight:600}
  td.name a:hover{text-decoration:underline}
  td.meta{color:var(--muted);font-size:12px}
  td.act{text-align:right;white-space:nowrap}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px}
  body.no-admin .admin-only{display:none!important}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,24,38,.96);
    border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-size:12.5px;
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
  #toast.show{opacity:1} #toast.bad{border-color:rgba(239,68,68,.6);background:rgba(60,12,12,.96)}
</style>
</head>
<body class="no-admin">
  <header>
    <div>
      <div class="t">Reference Drawings</div>
      <div class="s">PDF references for module layout, groupings, and field reference.</div>
    </div>
    <div class="row">
      <span id="who" style="color:var(--muted);font-size:11px"></span>
      <button class="btn" id="btn-auth">Sign in</button>
      <a class="btn" href="/">← Dashboard</a>
    </div>
  </header>

  <div class="card admin-only">
    <h2>Upload</h2>
    <label id="drop">
      <div><b>Click to pick a PDF</b> or drop one here</div>
      <div style="font-size:11px;margin-top:4px">Large files are chunked automatically — 30 MB+ is fine.</div>
      <input type="file" id="file" accept="application/pdf,.pdf" />
      <div id="picked"></div>
    </label>
    <div style="height:10px"></div>
    <div class="grid">
      <div class="fld"><label>Kind / section (optional)</label><input type="text" id="kind" placeholder="e.g. N1–N3 module layout" /></div>
      <div class="fld"><label>Note (optional)</label><input type="text" id="note" placeholder="Revision, source, anything useful" /></div>
    </div>
    <div style="height:12px"></div>
    <div class="row">
      <button class="btn primary" id="btn-upload" disabled>Upload</button>
      <span id="status"></span>
    </div>
    <div id="bar"><div></div></div>
  </div>

  <div class="card">
    <h2>Uploaded drawings</h2>
    <div id="list-wrap"><div class="empty">Loading…</div></div>
  </div>

  <div id="toast"></div>

  <script src="assets/midway-api.js"></script>
  <script>
  const $=id=>document.getElementById(id);
  function toast(m,bad=false,ms=2400){const t=$("toast");t.textContent=m;t.classList.toggle("bad",!!bad);t.classList.add("show");
    clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),ms);}
  function fmtBytes(n){const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++;}return n.toFixed(n>=10||i===0?0:1)+" "+u[i];}
  function fmtTs(s){if(!s)return"";try{return new Date(s).toLocaleString();}catch{return s;}}

  // ---- Upload ------------------------------------------------------------
  let picked=null;
  const drop=$("drop"), fileInput=$("file");
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over");});
  drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
  drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");
    if(e.dataTransfer.files && e.dataTransfer.files[0]) setPicked(e.dataTransfer.files[0]);});
  fileInput.addEventListener("change",e=>{if(e.target.files&&e.target.files[0])setPicked(e.target.files[0]);});
  function setPicked(f){
    picked=f;
    $("picked").textContent = f ? `${f.name} · ${fmtBytes(f.size)}` : "";
    $("btn-upload").disabled = !f;
  }
  $("btn-upload").addEventListener("click", async ()=>{
    if(!picked) return;
    if(!MidwayAPI.user()){ MidwayAPI.login(); return; }
    $("btn-upload").disabled=true; $("bar").classList.add("show");
    $("status").textContent="Preparing…";
    try{
      const res = await MidwayAPI.uploadDoc(picked, {
        kind: $("kind").value.trim(),
        note: $("note").value.trim(),
        onProgress: ({sent,total,chunkIndex,chunks})=>{
          const pct = total ? Math.round(sent*100/total) : 0;
          $("bar").firstElementChild.style.width = pct + "%";
          $("status").textContent = `Uploading chunk ${chunkIndex} / ${chunks} · ${fmtBytes(sent)} of ${fmtBytes(total)}`;
        },
      });
      $("bar").firstElementChild.style.width="100%";
      $("status").textContent = `Uploaded ${res.name}`;
      toast("Uploaded " + res.name);
      picked=null; fileInput.value=""; $("picked").textContent="";
      $("kind").value=""; $("note").value="";
      await loadList();
    }catch(err){
      console.error(err);
      $("status").textContent="";
      toast("Upload failed: " + (err.message||err), true, 4000);
    }finally{
      $("btn-upload").disabled = !picked;
      setTimeout(()=>{ $("bar").classList.remove("show"); $("bar").firstElementChild.style.width="0"; }, 1000);
    }
  });

  // ---- List --------------------------------------------------------------
  async function loadList(){
    const wrap=$("list-wrap");
    try{
      const docs = await MidwayAPI.listDocs();
      if(!docs.length){ wrap.innerHTML = '<div class="empty">No drawings uploaded yet.</div>'; return; }
      const admin = MidwayAPI.isAdmin();
      const rows = docs.map(d => `
        <tr>
          <td class="name"><a href="${MidwayAPI.docUrl(d.id)}" target="_blank" rel="noopener">${escapeHTML(d.name)}</a>
            ${d.kind?`<div class="meta">${escapeHTML(d.kind)}</div>`:""}
            ${d.note?`<div class="meta">${escapeHTML(d.note)}</div>`:""}</td>
          <td class="meta">${fmtBytes(d.size)}</td>
          <td class="meta">${escapeHTML(d.uploader||"")}<div>${fmtTs(d.ts)}</div></td>
          <td class="act">
            <a class="btn" href="${MidwayAPI.docUrl(d.id)}" target="_blank" rel="noopener">Open</a>
            ${admin?`<button class="btn" data-del="${d.id}" data-name="${escapeAttr(d.name)}">Delete</button>`:""}
          </td>
        </tr>`).join("");
      wrap.innerHTML = `<table><thead><tr><th>File</th><th>Size</th><th>Uploaded</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
      wrap.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async ()=>{
        const id=b.getAttribute("data-del"), name=b.getAttribute("data-name");
        if(!confirm(`Delete "${name}"?`)) return;
        try{ await MidwayAPI.deleteDoc(id); toast("Deleted"); await loadList(); }
        catch(e){ toast("Delete failed: " + (e.message||e), true); }
      }));
    }catch(e){
      wrap.innerHTML = '<div class="empty">Could not load (sign in first).</div>';
    }
  }
  function escapeHTML(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
  function escapeAttr(s){return escapeHTML(s);}

  // ---- Auth wiring -------------------------------------------------------
  function refreshAuthUI(){
    const u = MidwayAPI.user();
    $("who").textContent = u ? MidwayAPI.userName() : "";
    $("btn-auth").textContent = u ? "Sign out" : "Sign in";
    document.body.classList.toggle("no-admin", !(u && MidwayAPI.isAdmin()));
  }
  $("btn-auth").addEventListener("click", ()=>{ MidwayAPI.user() ? MidwayAPI.logout() : MidwayAPI.login(); });

  MidwayAPI.onChange(()=>{ refreshAuthUI(); loadList(); });
  MidwayAPI.init().then(()=>{ refreshAuthUI(); loadList(); });
  </script>
</body>
</html>
