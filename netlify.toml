[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Clean URL for the shipment tracking tool. Must come before the SPA
# catch-all below so it matches first.
[[redirects]]
  from = "/shipments"
  to = "/shipments.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
