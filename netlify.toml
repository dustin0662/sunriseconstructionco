[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Clean URLs for the shipment tracking tools. Must come before the SPA
# catch-all below so they match first.
[[redirects]]
  from = "/shipments"
  to = "/shipments.html"
  status = 200

[[redirects]]
  from = "/loads-admin"
  to = "/shipments-admin.html"
  status = 200

[[redirects]]
  from = "/client"
  to = "/client.html"
  status = 200

[[redirects]]
  from = "/piles"
  to = "/pile-tracker.html"
  status = 200

[[redirects]]
  from = "/pile-tracker"
  to = "/pile-tracker.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
