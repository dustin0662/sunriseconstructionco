<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a14" />
<title>Loads Admin | SRC Logistics Tracker</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--orange:#F97316;--orangeDeep:#e86a10;--red:#c41e2e;--green:#22c55e;--ink:#0a0a14;--ink2:#10101e;--cream:#F5F0EB;--line:#2a2a3a;
    --d:'Bebas Neue','Arial Narrow',sans-serif;--b:'DM Sans',system-ui,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--b);background:var(--ink);color:var(--cream);min-height:100vh;min-height:100svh;line-height:1.4;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 calc(14px + env(safe-area-inset-right)) 70px calc(14px + env(safe-area-inset-left));}
  header.top{position:sticky;top:0;z-index:20;background:rgba(10,10,20,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 0 14px;flex-wrap:wrap;}
  header.top img{height:32px;width:auto;}
  header.top .sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);}
  header.top h1{font-family:var(--d);font-weight:400;font-size:24px;letter-spacing:.04em;margin:0;line-height:1;color:#fff;}
  header.top .logout{margin-left:auto;}
  .tabs{display:flex;gap:4px;width:100%;margin-top:8px;}
  .tab{background:none;border:none;border-bottom:2px solid transparent;color:#9aa4b8;font-family:var(--b);font-weight:600;
    font-size:14px;padding:10px 14px;cursor:pointer;}
  .tab.active{color:#fff;border-bottom-color:var(--orange);}
  .linkbtn{background:none;border:none;color:#9aa4b8;font-family:var(--b);font-size:13px;text-decoration:underline;cursor:pointer;min-height:40px;padding:8px 10px;}
  .btn{font-family:var(--b);font-weight:700;font-size:14px;cursor:pointer;border:none;border-radius:10px;padding:11px 15px;
    letter-spacing:.02em;display:inline-flex;align-items:center;gap:7px;justify-content:center;text-decoration:none;}
  .btn-primary{background:var(--orange);color:#1a0f00;} .btn-primary:active{background:var(--orangeDeep);}
  .btn-ghost{background:#0c0c18;color:var(--cream);border:1px solid var(--line);}
  .btn-green{background:var(--green);color:#04210f;}
  .btn:disabled{opacity:.5;cursor:not-allowed;} .btn-sm{padding:7px 11px;font-size:12px;}
  .card{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .card h2{font-family:var(--d);font-weight:400;font-size:20px;letter-spacing:.03em;margin:0 0 12px;color:#fff;}
  label.fl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9aa4b8;margin:0 0 5px;font-weight:600;}
  input[type=text],input[type=number],input[type=password],select,textarea{width:100%;font-family:var(--b);font-size:16px;color:#fff;
    background:#0c0c18;border:1px solid var(--line);border-radius:9px;padding:11px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);}
  textarea{min-height:64px;resize:vertical;}
  .row{display:grid;gap:10px;} @media(min-width:640px){.row.c2{grid-template-columns:1fr 1fr;}}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
  .toolbar .count{font-size:13px;color:#9aa4b8;margin-right:auto;}
  .plist{display:flex;flex-direction:column;gap:8px;}
  .prow{display:flex;align-items:center;gap:10px;background:#0c0c18;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .prow .pn{font-weight:700;color:#fff;} .prow .pc{font-size:12px;color:#9aa4b8;}
  .badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 7px;}
  .badge-active{background:rgba(34,197,94,.16);color:var(--green);}
  .badge-count{background:rgba(249,115,22,.16);color:var(--orange);}
  .badge-issued{background:var(--green);color:#04210f;}
  .badge-pending{background:#eab308;color:#1a1400;}

  .entry{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:start;}
  .entry .thumb{width:80px;height:80px;border-radius:9px;object-fit:cover;background:#0c0c18;border:1px solid var(--line);cursor:pointer;}
  .entry .who{font-weight:700;color:#fff;font-size:14px;} .entry .ts{font-size:11px;color:#8f98ac;}
  table.mini{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px;}
  table.mini th{text-align:left;color:#8f98ac;font-weight:600;font-size:10px;text-transform:uppercase;padding:2px 8px 2px 0;}
  table.mini td{padding:2px 8px 2px 0;border-top:1px solid rgba(255,255,255,.05);} table.mini td.c{color:var(--orange);font-weight:700;}
  .empty{text-align:center;color:#6b7280;padding:34px 10px;}

  .cal{background:#0c0c18;border:1px solid var(--line);border-radius:12px;padding:12px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head .m{font-family:var(--d);font-size:22px;letter-spacing:.03em;color:#fff;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{text-align:center;font-size:10px;color:#8f98ac;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px;}
  .cal-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:#10101e;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:14px;cursor:pointer;position:relative;color:#cbd0da;}
  .cal-cell.blank{border:none;background:none;cursor:default;}
  .cal-cell.has{border-color:var(--orange);color:#fff;font-weight:700;}
  .cal-cell.issued{background:rgba(34,197,94,.14);border-color:var(--green);}
  .cal-cell.sel{outline:2px solid var(--orange);}
  .cal-cell .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;}
  .cal-cell.has .dot{background:var(--orange);} .cal-cell.issued .dot{background:var(--green);}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px;}
  .kpi{flex:1;min-width:110px;background:#0c0c18;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#8f98ac;} .kpi .v{font-family:var(--d);font-size:26px;color:var(--orange);}
  .eqrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
  .filechip{display:inline-flex;align-items:center;gap:6px;background:#0c0c18;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;margin:4px 6px 0 0;}
  .filechip .x{cursor:pointer;color:var(--red);font-weight:700;}

  .overlay{position:fixed;inset:0;background:rgba(4,4,10,.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
  .modal{background:var(--ink2);border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:14px;padding:26px;width:100%;max-width:380px;text-align:center;}
  .modal img{height:40px;width:auto;margin-bottom:10px;} .modal h3{font-family:var(--d);font-weight:400;font-size:26px;margin:0 0 6px;color:#fff;}
  .modal p{margin:0 0 16px;font-size:13px;color:#9aa4b8;} .modal input{text-align:center;letter-spacing:.1em;margin-bottom:12px;}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111;border:1px solid var(--line);
    border-left:4px solid var(--orange);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);} .toast.err{border-left-color:var(--red);}
  table.bom{width:100%;border-collapse:collapse;font-size:13px;}
  table.bom th{background:#0a0a14;color:#fff;font-family:var(--b);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10px;text-align:left;padding:8px 10px;position:sticky;top:0;}
  table.bom td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:middle;}
  table.bom td.r{text-align:right;font-variant-numeric:tabular-nums;} table.bom td.col{font-weight:700;color:var(--orange);}
  table.bom tr.click{cursor:pointer;} table.bom tr.click:hover td{background:#12121f;}
  table.bom tr.tot td{background:#12121f;font-weight:700;border-top:2px solid var(--line);}
  .var-ok{color:var(--green);} .var-part{color:#eab308;} .var-over{color:var(--red);}
  .pbar{height:7px;border-radius:4px;background:#0c0c18;border:1px solid var(--line);overflow:hidden;min-width:70px;}
  .pbar>span{display:block;height:100%;background:var(--orange);} .pbar>span.full{background:var(--green);} .pbar>span.over{background:var(--red);}
  .bomwrap{overflow-x:auto;} .desc{color:#9aa4b8;font-size:11px;max-width:280px;}
  .hide{display:none!important;}
</style>
</head>

const ENTRIES="/.netlify/functions/entries", PROJECTS="/.netlify/functions/projects",
  DAYREPORT="/.netlify/functions/dayreport", FILES="/.netlify/functions/files",
  EOD="/.netlify/functions/eod", PHOTO="/.netlify/functions/photo";

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m,e){const t=$("toast");t.textContent=m;t.className="toast show"+(e?" err":"");clearTimeout(toast._t);toast._t=setTimeout(()=>t.className="toast",3600);}
function fmtTime(iso){try{return new Date(iso).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}catch{return iso;}}
function loadItems(en){if(en.items&&en.items.length)return en.items;return[{color:en.color,block:en.block,qtyPerBundle:en.qtyPerBundle,bundlesPerLoad:en.bundlesPerLoad}];}
const pad=(n)=>String(n).padStart(2,"0");
const dstr=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;

function unlock(){$("gate").classList.add("hide");$("app").classList.remove("hide");sessionStorage.setItem("adminOk","1");boot();}
$("passBtn").onclick=()=>{ if($("passInput").value===ADMIN_PASSCODE) unlock(); else {$("passErr").textContent="Incorrect passcode.";$("passInput").select();} };
$("passInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("passBtn").click();});
$("logoutBtn").onclick=()=>{sessionStorage.removeItem("adminOk");location.reload();};

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  const v=t.dataset.view;
  $("viewDaily").classList.toggle("hide",v!=="daily");
  $("viewProjects").classList.toggle("hide",v!=="projects");
  $("viewLoads").classList.toggle("hide",v!=="loads");
  $("viewBom").classList.toggle("hide",v!=="bom");
  if(v==="loads"&&!ALL.length) loadAllLoads();
  if(v==="bom") initBom();
});

let PROJ=[], ACTIVE="", ALL=[];
let calY, calM, curProject="", daySet={issued:[],loadDays:[]}, selDate="";

async function boot(){ const now=new Date(); calY=now.getFullYear(); calM=now.getMonth(); await loadProjects(); }

async function loadProjects(){
  try{
    const r=await fetch(PROJECTS+"?admin="+encodeURIComponent(ADMIN_PASSCODE));
    const d=await r.json(); PROJ=d.projects||[]; ACTIVE=d.activeProjectId||"";
    renderProjects(); fillProjectSelect();
  }catch(e){ console.error(e); toast("Couldn't load projects.",true); }
}
function fillProjectSelect(){
  const sel=$("dProject"); const prev=curProject||ACTIVE||(PROJ[0]&&PROJ[0].id)||"";
  sel.innerHTML=PROJ.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}${p.id===ACTIVE?" (active)":""}</option>`).join("")||'<option value="">No projects yet</option>';
  sel.value=prev; curProject=sel.value;
  sel.onchange=()=>{curProject=sel.value;selDate="";$("dayEditor").innerHTML="";renderCalendar();};
  renderCalendar();
}
function renderProjects(){
  const el=$("projList");
  if(!PROJ.length){el.innerHTML='<div class="empty">No projects yet. Create one above.</div>';return;}
  el.innerHTML=PROJ.map(p=>`<div class="prow"><div style="flex:1;min-width:0;">
    <div class="pn">${esc(p.name)} ${p.id===ACTIVE?'<span class="badge badge-active">Active</span>':''}</div>
    <div class="pc">Client: ${esc(p.client||"—")} · Block ${esc(p.block||"—")} · PIN ${esc(p.clientPin||"—")}</div></div>
    ${p.id===ACTIVE?'':`<button class="btn btn-ghost btn-sm" data-active="${esc(p.id)}">Set Active</button>`}</div>`).join("");
  el.querySelectorAll("[data-active]").forEach(b=>b.onclick=async()=>{
    await api(PROJECTS,{action:"setActive",projectId:b.dataset.active}); toast("Active project updated ✓"); loadProjects();
  });
}
$("npCreate").onclick=async()=>{
  const name=$("npName").value.trim(); if(!name){toast("Project name required.",true);return;}
  const body={action:"create",name,client:$("npClient").value.trim(),block:$("npBlock").value.trim(),clientPin:$("npPin").value.trim()};
  const r=await api(PROJECTS,body); if(r&&r.id){toast("Project created ✓");["npName","npClient","npBlock","npPin"].forEach(i=>$(i).value="");loadProjects();}
};
async function api(url,body){
  try{ const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({admin:ADMIN_PASSCODE,...body})});
    const d=await r.json().catch(()=>({})); if(!r.ok){toast(d.error||("Error "+r.status),true);return null;} return d;
  }catch(e){console.error(e);toast("Network error.",true);return null;}
}

async function renderCalendar(){
  const wrap=$("calWrap");
  if(!curProject){wrap.innerHTML='<div class="empty">Create a project first.</div>';return;}
  try{ const r=await fetch(`${DAYREPORT}?list=1&project=${encodeURIComponent(curProject)}&admin=${encodeURIComponent(ADMIN_PASSCODE)}`);
    daySet=await r.json(); }catch{ daySet={issued:[],loadDays:[]}; }
  const issued=new Set(daySet.issued||[]), has=new Set(daySet.loadDays||[]);
  const first=new Date(calY,calM,1), startDow=first.getDay(), days=new Date(calY,calM+1,0).getDate();
  const monthName=first.toLocaleDateString([],{month:"long",year:"numeric"});
  let cells="";
  ["S","M","T","W","T","F","S"].forEach(d=>cells+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell blank"></div>';
  for(let d=1;d<=days;d++){ const ds=dstr(calY,calM,d);
    const cls=["cal-cell"]; if(issued.has(ds))cls.push("issued"); else if(has.has(ds))cls.push("has"); if(ds===selDate)cls.push("sel");
    const dot=(issued.has(ds)||has.has(ds))?'<span class="dot"></span>':'';
    cells+=`<div class="${cls.join(" ")}" data-d="${ds}">${d}${dot}</div>`;
  }
  wrap.innerHTML=`<div class="cal"><div class="cal-head"><button class="btn btn-ghost btn-sm" id="calPrev">‹</button>
    <span class="m">${monthName}</span><button class="btn btn-ghost btn-sm" id="calNext">›</button></div>
    <div class="cal-grid">${cells}</div>
    <div style="font-size:11px;color:#8f98ac;margin-top:8px;"><span class="badge badge-issued">Issued</span> &nbsp; <span class="badge badge-count">Has loads</span></div></div>`;
  $("calPrev").onclick=()=>{calM--;if(calM<0){calM=11;calY--;}renderCalendar();};
  $("calNext").onclick=()=>{calM++;if(calM>11){calM=0;calY++;}renderCalendar();};
  wrap.querySelectorAll("[data-d]").forEach(c=>c.onclick=()=>openDay(c.dataset.d));
}

async function openDay(date){
  selDate=date; renderCalendar();
  const box=$("dayEditor"); box.innerHTML='<div class="card"><div class="empty">Loading day…</div></div>';
  let data;
  try{ const r=await fetch(`${DAYREPORT}?project=${encodeURIComponent(curProject)}&date=${date}&admin=${encodeURIComponent(ADMIN_PASSCODE)}`); data=await r.json(); }
  catch(e){ box.innerHTML='<div class="card"><div class="empty">Failed to load.</div></div>'; return; }
  const ex=data.extras||{}, t=data.totals||{loads:0,bundles:0,pieces:0};
  const dateLabel=new Date(date+"T12:00:00").toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  const ticketRows=(data.loads||[]).map(ld=>loadItems(ld).map(it=>
    `<tr><td>#${esc(ld.id)}</td><td>${esc(ld.filler||"")}</td><td class="c">${esc(it.color)}</td><td>${esc(it.block)}</td><td>${esc(it.qtyPerBundle)}</td><td>${esc(it.bundlesPerLoad)}</td><td>${(Number(it.qtyPerBundle)||0)*(Number(it.bundlesPerLoad)||0)}</td></tr>`).join("")).join("");
  const dayBlocks=[...new Set((data.loads||[]).flatMap(ld=>loadItems(ld).map(it=>it.block)).filter(Boolean))];
  const issuedBadge=data.issued?`<span class="badge badge-issued">Issued ${esc(fmtTime(data.issuedAt))}</span>`:`<span class="badge badge-pending">Not issued</span>`;
  box.innerHTML=`<div class="card">
    <h2>${esc(dateLabel)} ${issuedBadge}</h2>
    <div class="kpis"><div class="kpi"><div class="k">Loads</div><div class="v">${t.loads}</div></div>
      <div class="kpi"><div class="k">Bundles</div><div class="v">${t.bundles}</div></div>
      <div class="kpi"><div class="k">Pieces</div><div class="v">${t.pieces}</div></div></div>

function initBom(){

  }).join("");

function renderBomBlock(dm){
  const body=$("bomBody"), b=bomBlock, del=dm[b]||{};
  const rows=bomData.rows.map(r=>{ const need=r.blocks[b]||0; const d=del[(r.color||"").toUpperCase()]||0;
    if(need===0 && d===0) return "";
    const rem=need-d, pct=need>0?Math.round(d/need*100):(d>0?100:0);
    return `<tr><td class="col">${esc(r.color)}</td><td>${esc(r.postType||"")}</td><td class="desc">${esc(r.description||"")}</td>
      <td class="r">${need.toLocaleString()}</td><td class="r">${d.toLocaleString()}</td>
      <td class="r ${varClass(need,d)}">${rem<0?"+"+(-rem).toLocaleString():rem.toLocaleString()}</td>
      <td style="width:110px">${bar(need,d)}</td><td class="r">${pct}%</td></tr>`;
  }).join("");
  const need=bomData.rows.reduce((n,r)=>n+(r.blocks[b]||0),0);
  const dtot=Object.values(del).reduce((n,v)=>n+v,0);
  const rem=need-dtot, pct=need>0?Math.round(dtot/need*100):0;
  body.innerHTML=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
      <button class="btn btn-ghost btn-sm" id="bomBack">‹ All blocks</button>
      <div style="font-family:var(--d);font-size:22px;color:#fff;">Block ${esc(b)}</div>
      <button class="btn btn-ghost btn-sm" id="bomXlsx2">⬇ Export Excel</button></div>
    <div class="bomwrap"><table class="bom"><thead><tr><th>Color</th><th>Type</th><th>Description</th><th class="r">Needed</th><th class="r">Delivered</th><th class="r">Remaining</th><th>Progress</th><th class="r">%</th></tr></thead>
    <tbody>${rows}<tr class="tot"><td colspan="3">TOTAL — ${esc(b)}</td><td class="r">${need.toLocaleString()}</td><td class="r">${dtot.toLocaleString()}</td>
      <td class="r ${varClass(need,dtot)}">${rem<0?"+"+(-rem).toLocaleString():rem.toLocaleString()}</td><td>${bar(need,dtot)}</td><td class="r">${pct}%</td></tr></tbody></table></div>
  </div>`;
  $("bomBack").onclick=()=>{bomBlock=null;renderBom();};
  $("bomXlsx2").onclick=()=>exportBomXlsx(dm);
}

async function exportBomXlsx(dm){
  try{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const aoa=[["Block","Color","Type","Description","Needed","Delivered","Remaining","% Complete"]];
    bomData.blocksOrder.forEach(b=>{ const del=dm[b]||{};
      bomData.rows.forEach(r=>{ const need=r.blocks[b]||0; const d=del[(r.color||"").toUpperCase()]||0; if(need===0&&d===0)return;
        aoa.push([b,r.color,r.postType||"",r.description||"",need,d,need-d,need>0?Math.round(d/need*100)+"%":""]); }); });
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=[{wch:9},{wch:20},{wch:22},{wch:40},{wch:9},{wch:10},{wch:10},{wch:11}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"BOM vs Delivered");
    XLSX.writeFile(wb,"bom-vs-delivered-"+fileStamp()+".xlsx"); toast("Excel exported ✓");
  }catch(e){ toast("Excel failed (needs internet).",true); }
}

if(sessionStorage.getItem("adminOk")==="1")unlock(); else setTimeout(()=>$("passInput").focus(),60);
</script>
